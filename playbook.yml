---
- name: My First AWX Job
  hosts: all
  gather_facts: false

  tasks:
    - name: Display welcome message
      ansible.builtin.debug:
        msg: "Hello from AWX and Ansible!"

    - name: Display environment information
      ansible.builtin.debug:
        msg:
          - "This playbook is running through AWX"
          - "Learning Ansible automation"
